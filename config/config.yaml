seed: 42

data:
  path: data/raw/xauusd_1m.csv
  timezone_in: "UTC"
  timezone_out: "UTC"
  main_start: "2026-06-22"
  dev_end: "2026-10-11"
  holdout_start: "2026-10-11"      # TOUCHED ONCE at the very end — DO NOT CHANGE
  full_period_experiment: false
  min_price: 100.0
  max_gap_minutes: 30

symbol:
  name: "XAUUSD"                   # auto-resolve suffixes (XAUUSDm, XAUUSD.a, ...)
  contract_size: 100               # oz per lot; read from MT5 when available
  point: 0.01

costs:
  spread_price_units: 0.25         # fallback constant spread (price units)
  slippage_price_units: 0.05
  commission_per_lot_round_trip: 7.0   # USD per round-trip lot → 0.07 price units / lot
  spread_stress: [1.0, 1.5, 2.0]

features:
  lookback: 10          # reduced to fit RAM
  atr_period: 14
  vol_windows: [5, 15, 30]
  ema_periods: [20, 50, 200]

labels:
  # EXTENDED horizons per Step 3: H=15+ lets price move far enough to exceed ~0.42 cost
  # At 1-min ATR ~0.30, H=30 gives ~30*0.30 = 9 price units max move → cost ratio much better
  horizon_bars: [15, 30, 60]
  tp_atr_mult_k: [1.0, 1.5, 2.0]     # TP must be >= 3x round-trip cost (~0.42) → k*ATR >= 1.26
  sl_atr_mult_m: [0.5, 0.75, 1.0]

walk_forward:
  train_months: 1           # data span ~3.7 months → 1-month folds gives 1-2 folds
  val_months: 1
  test_months: 1
  step_months: 1
  embargo_trading_days: 1   # 1 day (~1440 min-bars) embargo after each eval period

model:
  names: [lgbm, mlp, gated_fusion]   # lstm+transformer omitted: OOM with limited RAM
  epochs_max: 60
  early_stop_patience: 8
  batch_size: 512
  lr_grid: [3.0e-4, 1.0e-4, 5.0e-5]
  dropout_grid: [0.1, 0.2, 0.3]
  weight_decay_grid: [1.0e-4, 1.0e-3]

decision:
  # Threshold >= 0.65 required (clearly above 3-class random baseline ~0.33)
  prob_threshold_grid: [0.55, 0.60, 0.65, 0.70]
  max_spread_price_units: 0.35       # skip when spread > 0.35 (fraction of min expected move)
  sessions_allowed: ["london", "ny", "overlap"]
  blackout_utc: ["21:55-23:05"]
  news_blackout_file: null
  min_expected_R: 0.20               # at least 0.20 ATR expected net of costs before entering

risk:
  risk_fraction_kappa: 0.01          # 1% per trade
  max_open_positions: 1              # SINGLE position at a time (no stacking)
  max_consecutive_losses: 4          # pause after 4 consecutive losses
  daily_loss_limit_pct: 3.0          # 3% daily drawdown limit
  cooldown_bars_after_exit: 2        # 2-bar cooldown after every exit

profit_gate:
  # RESTORED thresholds — DO NOT WEAKEN
  min_oos_trades: 100               # minimum 100 OOS trades for statistical validity
  min_profit_factor: 1.1
  min_positive_fold_fraction: 0.60
  require_positive_at_spread_mult: 1.5
  require_bootstrap_ci_lower_gt_zero: true   # RESTORED: requires CI lower > 0

live:
  mode: "demo"
  allow_live_money: false
  demo_override_gate: false          # RESTORED: do NOT bypass gate even in demo
  magic_number: 20260930
  deviation_points: 6               # reduced from 20 to 6 (0.06 price units max slippage per leg)
  max_data_staleness_seconds: 90
  kill_switch_file: "KILL"
  poll_interval_seconds: 60         # bar-based entry, 1-min poll
  htf_refresh_bars: 5               # refresh H1/M5 every 5 polls

position_management:
  trailing_enabled: true
  trail_trigger_bars: 5             # activate trail after 5 bars
  trail_sl_to_breakeven: true
  trail_tp_multiplier: 1.5
  sl_atr_mult: 0.75
  tp_atr_mult: 1.5                  # TP = 1.5xATR >= 3x cost at typical ATR

sessions:
  asia:    ["00:00", "07:00"]
  london:  ["07:00", "12:00"]
  overlap: ["12:00", "16:00"]
  ny:      ["16:00", "21:00"]

training:
  lambda_nll_ce: 1.0
  grad_clip: 1.0
  hp_search_folds: 2                # first 2 folds used for HP search

logging:
  level: "INFO"
  log_dir: "logs"
